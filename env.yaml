name: factr12
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.12
  - pytorch=2.5.*
  - torchvision=0.20.*
  - pytorch-cuda=12.4
  - numpy<2
  - scipy
  - tqdm
  - pip

  - pip:
      - tensorflow==2.17.*
      - diffusers
      - hydra-core
      - omegaconf
      - wandb
      - timm
      - imageio
      - pytorch-lightning
      - matplotlib
      - git+https://github.com/facebookresearch/r3m.git
      - git+https://github.com/AGI-Labs/robobuf.git
      - -e .