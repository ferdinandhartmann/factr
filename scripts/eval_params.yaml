eval_single_episode_lowdim:
  num_samples: 40
  action_source: prior # options: prior, posterior
  sample: true # true samples latent predictions; false repeats deterministic mean/mode predictions
  stiffness_label: 2 # mode 0 -> class 1, mode 1 -> class 2 null infers from episode; otherwise use 1-based label, e.g. 1=soft, 2=medium, 3=stiff
  prediction_stride: 50
  view_elev: 24
  view_azim: -60
  show_plot: false # shows also 3d plot
  enable_train_background: true
  train_background_only_medium: false
  rpy_subtract_pi: true # If true, subtract pi from one selected RPY axis for plotting.
  rpy_subtract_pi_axis: 0 # 0=roll, 1=pitch, 2=yaw
  rpy_plot_unit: deg  # "rad" or "deg"
  plot_geodesic_subplot: false
  out_dir_override: null
  global_axis_limits:
    x: [0.2, 0.6]
    y: [-0.4, 0.4]
    z: [0.0, 0.7]
  goal_frames:
    - name: goal 1
      pose: [0.341, 0.240, 0.606, 0.999, -0.007, 0.013, -0.007, -1.000, -0.010]
    - name: goal 2
      pose: [0.524, 0.226, 0.381, 1.000, 0.013, 0.025, 0.013, -1.000, 0.004]
    - name: goal 3
      pose: [0.439, -0.239, -0.043, 0.905, -0.425, 0.023, -0.426, -0.904, 0.028]
    - name: goal 4
      pose: [0.591, -0.336, -0.038, 0.907, -0.421, 0.037, -0.421, -0.907, 0.006]

eval_z_distr:
  save_dir_override: null
  save_static_plots: true
  save_video: true
  video_fps: 30 # playback speed
  video_dpi: 50
  video_frame_stride: 2 # use every Nth frame for video
  video_x_points: 80 # number of x points in distribution plots
  video_x_std_mult: 4.0 # x range for distribution plots will be [mu - x_std_mult*std, mu + x_std_mult*std]
  # 0 -> auto: min(num_episodes, max(1, cpu_count - 1)); 1 -> disable parallel rendering
  max_parallel_episodes: 5

eval_stiffness_interpolation_pca:
  interpolation_step: 0.1 # [1,0], [0.9,0.1], ..., [0,1]
  plot_stride: 10 # plot every Nth episode window; PCA still uses every window
  color_map: turbo # high-contrast interpolation colors; alternatives: plasma, coolwarm
  show_plot: false
  out_dir_override: null
