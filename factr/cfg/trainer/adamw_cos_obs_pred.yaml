_target_: factr.trainers.obs_pred.GaussianObsPredictionTrainer

train_log_freq: ${train_log_freq}

optim_builder:
  optimizer_type: AdamW
  optimizer_kwargs:
    lr: ${lr}
    weight_decay: 0.0001

schedule_builder:
  _target_: factr.trainers.utils.schedule_builder
  schedule_type: CosineAnnealingLR
  from_diffusers: False
  schedule_kwargs:
    T_max: ${max_iterations}
    eta_min: 0.000001
