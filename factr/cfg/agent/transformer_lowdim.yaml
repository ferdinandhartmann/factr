_target_: factr.models.lowdim_action_transformer.LowdimStiffnessCVAEAgent

# --- IO shapes / contracts ---
# obs is windowed: `obs` has shape (B, W, obs_dim) where W = obs_window.
obs_dim: ${task.obs_dim}
ac_dim: ${task.ac_dim}
ac_chunk: ${ac_chunk}
obs_window: ${obs_window}
include_velocity: ${oc.select:include_velocity,true}
include_tracking_error: ${oc.select:include_tracking_error,true}
use_cls_token: false
# true: posterior sees the final commanded-pose token; false: command remains decoder-only.
posterior_include_command: true

stiffness_classes: ${stiffness_classes}
use_stiffness_conditioning: ${oc.select:use_stiffness_conditioning,true}
use_arrangement_conditioning: ${oc.select:use_arrangement_conditioning,false}
goal_label: ${oc.select:goal_label,false}
use_adaptive_layer_norm: ${oc.select:use_adaptive_layer_norm,false}
use_stiffness_goal_adaln_gate: ${oc.select:use_stiffness_goal_adaln_gate,false}
goal_adaln_gate_min: ${oc.select:goal_adaln_gate_min,0.1}

# --- Model size knobs ---
# token_dim: embedding width of every transformer token
# hidden_dim: MLP width used inside Transformer layers (dim_feedforward) AND the prior MLP
token_dim: 128
hidden_dim: 256

# --- CVAE latent ---
# d_z: dimensionality of latent z.
# - gaussian: direct latent size
# - categorical: decoder-side latent width after projecting the flattened one-hot latent
d_z: 12 # FOR CATEGORICAL: !!!!!!Should be same as variables*categories to turn of compression
latent_distribution: categorical  # gaussian | categorical
fixed_prior: true            # false -> learn p(z|context) instead of keeping a uniform categorical prior

categorical_num_variables: 4 # increasing variables compared to categories increases diversity
categorical_num_categories: 3 # increase for finer choises
categorical_temperature: 1.0 # Sharpness of the categorical distribution. (higher -> softer, lower -> sharper)
categorical_straight_through: true # true: hard one-hot Z choices with soft gradients, encouraging distinct modes; false: smoother soft mixtures that may blend modes.

beta: 0.035 # 0.005 # 10 # 0.001 # 1           # KL weight in total_loss = recon + beta * KL.
                    # Higher beta ⇒ stronger pressure for prior ≈ posterior (latent carries less extra “action-only” info)
                    # Lower beta ⇒ easier for posterior to use z to fit actions well, but the prior may lag behind (bigger prior-vs-posterior gap).
# If variable_beta is true, beta is chosen from the stiffness/mode label instead of this scalar.
variable_beta: true
variable_beta_upper: 0.011
variable_beta_lower: 0.00001
kl_balance_alpha: 0.75  # [0,1]. 0.5 keeps legacy behavior; >0.5: Prior is pushed harder toward posterior. Doesn't do anything if fixed_prior=true.
free_bits: null       # KL clamp

encoder_layers: 2
decoder_layers: 4
posterior_layers: 2
nhead: 4 # 8
dropout: 0.1

