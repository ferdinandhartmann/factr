defaults:
  - agent: transformer_lowdim
  - task: single_franka_lowdim
  - trainer: adamw_cos_lowdim
  - _self_

hydra:
  run:
    dir: /home/ferdinand/activeinference/factr/checkpoints/${dataset_project_prefix}fourgoals_24_allgauss_noclip_cmdinput_rel_perdim/${exp_name}
  job:
    env_set:
      CUDA_VISIBLE_DEVICES: "2"

dataset_project_prefix: aifact_
dataset_name: fourgoals_24_allgauss_noclip_cmdinput_rel_perdim #fourgoals_2_allgauss_noclip_cmdinput_rel
sweep_pose_tag: rel
# Stiffness conditioning accepts 1-based scalar labels (1..C) or direct one-hot vectors (B, C).
stiffness_classes: 2
include_tracking_error: false # if false, atuomatically reduces obs_dim -6

buffer_path: /home/ferdinand/activeinference/factr/process_data/processed_data/${dataset_name}/buf_train.pkl
test_buffer_path: /home/ferdinand/activeinference/factr/process_data/processed_data/${dataset_name}/buf_test.pkl

exp_name: c_fp_b002_v4k4_ct1_klb5_obs4_2

batch_size: 180
num_workers: 4
lr: 0.00035
max_iterations: 10000
schedule_freq: 1
devices: 1
seed: 42
resume: false

ac_chunk: 60
obs_window: 4
action_chunk_mode: relative_timesteps  # Choices: absolute, relative_timesteps, relative_chunks
eval_plot_pose_mode: relative_timesteps  # Choices: absolute, relative_timesteps, relative_chunks

train_transform: none
test_transform: none

train_log_freq: 100
eval_freq: 500
eval_freq_plot: 2500  # Must be multiple of eval_freq
# save_freq: 2500

diversity_enable: false
diversity_num_samples: 30
diversity_weight: 0.4
diversity_weight_position: 1.0
diversity_weight_orientation: 0.0
diversity_warmup_steps: 500
diversity_margin: 0.7
diversity_smoothing: 0.15
diversity_debug: false

wandb:
  name: ${exp_name}
  project: ${dataset_project_prefix}fourgoals_24_allgauss_noclip_cmdinput_rel_perdim
  group: bc
  debug: False
  entity: None
