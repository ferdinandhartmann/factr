defaults:
  - agent: transformer_lowdim
  - task: single_franka_lowdim
  - trainer: adamw_cos_lowdim
  - _self_

hydra:
  run:
    dir: /home/ferdinand/activeinference/factr/checkpoints/boxlift_12_relative_perdim/${exp_name}
  job:
    env_set:
      CUDA_VISIBLE_DEVICES: "2"

# dataset_project_prefix:
dataset_name: boxlift_12_relative_perdim
sweep_pose_tag: rel

# Stiffness conditioning accepts 1-based scalar labels (1..C) or direct one-hot vectors (B, C).
use_stiffness_conditioning: true # (and mode if mode override is enabled)
use_arrangement_conditioning: true # condition on the three goal-height arrangement
goal_label: true # condition on grouped goals: 1-3, 4-6, and 7-9
# If true, active arrangement/goal conditions modulate context LayerNorm instead of adding tokens.
use_adaptive_layer_norm: true
# class 1/mode 0 weakly uses the goal; class 2/mode 1 uses it fully.
use_stiffness_goal_adaln_gate: true
goal_adaln_gate_min: 0.0
override_stiffness_with_mode: true
base_stiffness_classes: 1
stiffness_classes: ${stiffness_class_count:${use_stiffness_conditioning},${override_stiffness_with_mode},${base_stiffness_classes}}
include_velocity: true # if false, automatically reduces obs_dim -6 and removes the velocity token
include_tracking_error: false # if false, atuomatically reduces obs_dim -6

buffer_path: /home/ferdinand/activeinference/factr/process_data/processed_data/${dataset_name}/buf_train.pkl
# This combined test buffer contains both follow (mode 0) and leading (mode 1)
# episodes. task.py separates their eval plots using each sample's mode label.
test_buffer_path: /home/ferdinand/activeinference/factr/process_data/processed_data/${dataset_name}/buf_test.pkl

exp_name: h4l4_c_fp_b005_v3k3_obs4_arr_g_alngz

batch_size: 180
num_workers: 2
lr: 0.00035
max_iterations: 10000
schedule_freq: 1
devices: 1
seed: 42
resume: false

ac_chunk: 20
obs_window: 4
action_chunk_mode: relative  # Choices: absolute, delta, relative

train_transform: none
test_transform: none

train_log_freq: 100
eval_freq: 500
eval_freq_plot: 2500  # Must be multiple of eval_freq
# save_freq: 2500

diversity_enable: false
diversity_num_samples: 30
diversity_weight: 0.4
diversity_weight_position: 1.0
diversity_weight_orientation: 0.0
diversity_warmup_steps: 500
diversity_margin: 0.7
diversity_smoothing: 0.15
diversity_debug: false

wandb:
  name: ${exp_name}
  project: boxlift_12_relative_perdim
  group: bc
  debug: False
  entity: None
