defaults:
  - agent: transformer_lowdim
  - task: single_franka_lowdim
  - trainer: adamw_cos_lowdim
  - _self_

hydra:
  run:
    dir: /home/ferdinand/activeinference/factr/checkpoints/${dataset_project_prefix}${dataset_name}/${exp_name}
  job:
    env_set:
      CUDA_VISIBLE_DEVICES: "2"

dataset_project_prefix: aifact_
dataset_name: fourgoals_2_allgauss_noclip_cmdinput
stiffness_classes: 2

buffer_path: /home/ferdinand/activeinference/factr/process_data/processed_data/${dataset_name}/buf_train.pkl
test_buffer_path: /home/ferdinand/activeinference/factr/process_data/processed_data/${dataset_name}/buf_test.pkl

exp_base_name: categ_b001_v8k2_cattemp15_obs8
exp_base_name: categ_b001_v8k2_test_rel
suffix: _
exp_name: ${exp_base_name}

batch_size: 180
num_workers: 8
lr: 0.00035
max_iterations: 10000
schedule_freq: 1
devices: 1
seed: 42
resume: false

ac_chunk: 30
obs_window: 8
obs_window: 6
action_chunk_mode: absolute  # Choices: absolute, relative_timesteps, relative_chunks
eval_plot_pose_mode: absolute  # Choices: absolute, relative_timesteps, relative_chunks

train_transform: none
test_transform: none

train_log_freq: 100
eval_freq: 500
eval_freq_plot: 2500  # Must be multiple of eval_freq
# save_freq: 2500

diversity_enable: true
diversity_num_samples: 30
diversity_weight: 0.02
diversity_weight_position: 1.0
diversity_weight_orientation: 0.5
diversity_warmup_steps: 500

wandb:
  name: ${exp_name}
  project: ${dataset_project_prefix}${dataset_name}
  group: bc
  debug: False
  entity: None
